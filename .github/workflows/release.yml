name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-and-attest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install release tooling
        run: python -m pip install -e ".[dev,security]"
      - name: Verify stable release contract
        run: affiliate-mate-release verify
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          expected="${GITHUB_REF_NAME#v}"
          actual="$(python -c 'import affiliate_mate; print(affiliate_mate.__version__)')"
          test "$expected" = "$actual"
      - name: Run full test suite
        run: pytest -q
      - name: Run golden acceptance
        run: python scripts/v1_acceptance.py --max-seconds 20
      - name: Build distributions
        shell: bash
        run: |
          set -euo pipefail
          epoch="$(git log -1 --format=%ct "$GITHUB_SHA")"
          raw="$RUNNER_TEMP/raw-dist"
          release="$GITHUB_WORKSPACE/release"
          rm -rf "$raw" "$release"
          mkdir -p "$raw" "$release"
          SOURCE_DATE_EPOCH="$epoch" python -m build --sdist --wheel --outdir "$raw"
          wheel="$(find "$raw" -maxdepth 1 -type f -name '*.whl' -print -quit)"
          sdist="$(find "$raw" -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "$wheel"
          test -n "$sdist"
          cp "$wheel" "$release/$(basename "$wheel")"
          python scripts/normalize_sdist.py "$sdist" "$release/$(basename "$sdist")" --epoch "$epoch"
      - name: Generate SPDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          created_at="$(git show -s --format=%cI "$GITHUB_SHA")"
          affiliate-mate-ops sbom --created-at "$created_at" --output release/affiliate-mate.spdx.json
          python -m json.tool release/affiliate-mate.spdx.json > /dev/null
      - name: Generate and verify release manifest
        shell: bash
        run: |
          set -euo pipefail
          created_at="$(git show -s --format=%cI "$GITHUB_SHA")"
          affiliate-mate-release manifest \
            release/*.whl release/*.tar.gz release/affiliate-mate.spdx.json \
            --root . \
            --commit-sha "$GITHUB_SHA" \
            --created-at "$created_at" \
            --output release/release-manifest.json
          affiliate-mate-release manifest-verify release/release-manifest.json --root .
      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-path: "release/*"
      - uses: actions/upload-artifact@v4
        with:
          name: affiliate-mate-release-${{ github.ref_name }}
          path: release/*
          if-no-files-found: error

  github-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-and-attest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: affiliate-mate-release-${{ github.ref_name }}
          path: release
      - name: Publish immutable GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes

  pypi-publish:
    if: startsWith(github.ref, 'refs/tags/') && vars.PYPI_PUBLISH_ENABLED == 'true'
    needs: build-and-attest
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: affiliate-mate-release-${{ github.ref_name }}
          path: release
      - name: Prepare package-only distribution directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp release/*.whl release/*.tar.gz dist/
      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
