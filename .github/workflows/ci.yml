name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check . --fix
          git diff -- src/affiliate_mate/clustering.py src/affiliate_mate/freshness.py src/affiliate_mate/youtube_intelligence.py
      - name: Compile
        run: python -m compileall -q src tests
      - name: Tests
        run: pytest -q
