name: Security

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install audited environment
        run: python -m pip install -e ".[security]" pip-audit
      - name: Audit Python dependencies
        run: pip-audit --strict --progress-spinner off
      - name: Generate deterministic SPDX SBOM
        run: >-
          affiliate-mate-ops sbom
          --created-at 2026-01-01T00:00:00+00:00
          --output affiliate-mate.spdx.json
      - name: Validate SBOM JSON
        run: python -m json.tool affiliate-mate.spdx.json > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: affiliate-mate-spdx-sbom
          path: affiliate-mate.spdx.json
          if-no-files-found: error
